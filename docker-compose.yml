version: '3.8'

services:
  situation-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: situation-monitor
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - situation-monitor-net

networks:
  situation-monitor-net:
    driver: bridge
